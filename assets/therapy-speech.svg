<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="speechBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F7"/>
      <stop offset="100%" stop-color="#EBF7FD"/>
    </linearGradient>
    <filter id="softShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2942" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="450" rx="28" fill="url(#speechBg)"/>

  <!-- Big Friendly Speech Bubble 1 (Magenta) -->
  <g transform="translate(70, 80)" filter="url(#softShadow2)">
    <path d="M0 30 C0 13.4 13.4 0 30 0 L210 0 C226.6 0 240 13.4 240 30 L240 130 C240 146.6 226.6 160 210 160 L70 160 L30 195 L35 160 L30 160 C13.4 160 0 146.6 0 130 Z" fill="#E91E8C"/>
    <!-- Speech Dots & Sound waves inside -->
    <circle cx="70" cy="80" r="16" fill="#FFFFFF"/>
    <circle cx="120" cy="80" r="16" fill="#FFFFFF"/>
    <circle cx="170" cy="80" r="16" fill="#FFFFFF"/>
    <text x="120" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">COMMUNICATE</text>
  </g>

  <!-- Big Responsive Speech Bubble 2 (Sky Blue) -->
  <g transform="translate(290, 160)" filter="url(#softShadow2)">
    <path d="M0 30 C0 13.4 13.4 0 30 0 L210 0 C226.6 0 240 13.4 240 30 L240 120 C240 136.6 226.6 150 210 150 L195 150 L200 185 L160 150 L30 150 C13.4 150 0 136.6 0 120 Z" fill="#0095DA"/>
    <!-- Sound Waves icon -->
    <path d="M90 75 Q90 60 105 50 M105 100 Q90 90 90 75" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M120 75 Q120 45 145 30 M145 120 Q120 105 120 75" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="70" cy="75" r="14" fill="#FFFFFF"/>
    <text x="135" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">EXPRESS &amp; PLAY</text>
  </g>

  <!-- Picture Book & Phonics Cards at the bottom -->
  <g transform="translate(90, 280)" filter="url(#softShadow2)">
    <rect width="420" height="120" rx="20" fill="#FFFFFF"/>
    
    <!-- Open Book Illustration -->
    <path d="M50 35 Q100 25 150 40 L150 95 Q100 80 50 90 Z" fill="#EEF8E6" stroke="#5E9E2A" stroke-width="2"/>
    <path d="M150 40 Q200 25 250 35 L250 90 Q200 80 150 95 Z" fill="#EEF8E6" stroke="#5E9E2A" stroke-width="2"/>
    <line x1="150" y1="38" x2="150" y2="95" stroke="#5E9E2A" stroke-width="3"/>

    <!-- Vocabulary Flashcards -->
    <rect x="280" y="25" width="55" height="70" rx="8" fill="#FFF7E6" stroke="#E08E00" stroke-width="2"/>
    <text x="307" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#E08E00" text-anchor="middle">A</text>
    <rect x="345" y="25" width="55" height="70" rx="8" fill="#FFF0F7" stroke="#E91E8C" stroke-width="2"/>
    <text x="372" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#E91E8C" text-anchor="middle">B</text>
  </g>

  <!-- Cheerful Star -->
  <polygon points="500,60 504,72 516,72 506,80 510,92 500,84 490,92 494,80 484,72 496,72" fill="#E08E00"/>
</svg>