<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="eiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7E6"/>
      <stop offset="100%" stop-color="#EBF7FD"/>
    </linearGradient>
    <filter id="softShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2942" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="450" rx="28" fill="url(#eiBg)"/>

  <!-- Milestone Ladder / Growth Steps -->
  <g transform="translate(60, 160)" filter="url(#softShadow3)">
    <!-- Step 1 -->
    <rect x="0" y="160" width="100" height="90" rx="16" fill="#0095DA"/>
    <text x="50" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="50" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">DISCOVER</text>

    <!-- Step 2 -->
    <rect x="120" y="110" width="100" height="140" rx="16" fill="#5E9E2A"/>
    <text x="170" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="170" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">GUIDE</text>

    <!-- Step 3 -->
    <rect x="240" y="60" width="100" height="190" rx="16" fill="#E08E00"/>
    <text x="290" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="290" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">BUILD</text>

    <!-- Step 4 / Sprout Target -->
    <rect x="360" y="10" width="120" height="240" rx="20" fill="#E91E8C"/>
    <polygon points="420,55 425,70 440,70 428,80 432,95 420,85 408,95 412,80 400,70 415,70" fill="#FFFFFF"/>
    <text x="420" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">GROW</text>
    <text x="420" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">THRIVE TOGETHER</text>
  </g>

  <!-- Baby Footprints / Milestones -->
  <g transform="translate(140, 60)" opacity="0.8">
    <ellipse cx="40" cy="40" rx="16" ry="22" fill="#E08E00" opacity="0.4"/>
    <circle cx="28" cy="14" r="4" fill="#E08E00" opacity="0.4"/>
    <circle cx="36" cy="10" r="4" fill="#E08E00" opacity="0.4"/>
    <circle cx="45" cy="11" r="4" fill="#E08E00" opacity="0.4"/>
    <circle cx="53" cy="16" r="3.5" fill="#E08E00" opacity="0.4"/>
  </g>

  <!-- Gentle NDT Balance Beam -->
  <path d="M40 400 Q300 370 560 400" stroke="#0095DA" stroke-width="8" stroke-linecap="round"/>
  <circle cx="300" cy="385" r="18" fill="#5E9E2A" filter="url(#softShadow3)"/>

  <!-- Top Ribbon -->
  <g transform="translate(180, 25)" filter="url(#softShadow3)">
    <rect width="240" height="38" rx="19" fill="#FFFFFF"/>
    <text x="120" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#E08E00" text-anchor="middle">CRITICAL GROWTH YEARS (0-6)</text>
  </g>
</svg>