<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="seBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF8E6"/>
      <stop offset="100%" stop-color="#FFF0F7"/>
    </linearGradient>
    <filter id="softShadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2942" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="450" rx="28" fill="url(#seBg)"/>

  <!-- Interlocking Cognitive Puzzle Pieces (Autism / Special Education icon) -->
  <g transform="translate(110, 80)" filter="url(#softShadow4)">
    <!-- Puzzle 1 (Green) -->
    <rect x="0" y="0" width="110" height="110" rx="14" fill="#5E9E2A"/>
    <circle cx="110" cy="55" r="22" fill="#5E9E2A"/>
    <!-- Puzzle 2 (Blue) -->
    <rect x="110" y="0" width="110" height="110" rx="14" fill="#0095DA"/>
    <circle cx="165" cy="110" r="22" fill="#0095DA"/>
    <!-- Puzzle 3 (Magenta) -->
    <rect x="0" y="110" width="110" height="110" rx="14" fill="#E91E8C"/>
    <circle cx="55" cy="110" r="22" fill="#E91E8C"/>
    <!-- Puzzle 4 (Gold) -->
    <rect x="110" y="110" width="110" height="110" rx="14" fill="#E08E00"/>
    <circle cx="220" cy="165" r="22" fill="#E08E00"/>

    <!-- Icons inside pieces -->
    <path d="M55 42 L60 55 L74 55 L63 64 L67 77 L55 68 L43 77 L47 64 L36 55 L50 55 Z" fill="#FFFFFF"/>
    <!-- Heart inside piece -->
    <path d="M165 60 C165 60 145 42 145 30 C145 22 152 16 160 16 C165 16 168 19 170 22 C172 19 175 16 180 16 C188 16 195 22 195 30 C195 42 165 60 165 60 Z" fill="#FFFFFF"/>
    <!-- Smile in puzzle 3 -->
    <circle cx="55" cy="165" r="26" fill="#FFFFFF" opacity="0.2"/>
    <path d="M43 165 Q55 180 67 165" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="47" cy="155" r="4" fill="#FFFFFF"/>
    <circle cx="63" cy="155" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Reward Star Chart & Positive Reinforcement -->
  <g transform="translate(360, 90)" filter="url(#softShadow4)">
    <rect width="170" height="220" rx="18" fill="#FFFFFF"/>
    <rect x="20" y="20" width="130" height="28" rx="8" fill="#EEF8E6"/>
    <text x="85" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#5E9E2A" text-anchor="middle">DAILY PROGRESS</text>
    
    <!-- Stars rows -->
    <g transform="translate(25, 65)">
      <polygon points="15,0 19,10 30,10 21,17 24,27 15,20 6,27 9,17 0,10 11,10" fill="#E08E00"/>
      <polygon points="55,0 59,10 70,10 61,17 64,27 55,20 46,27 49,17 40,10 51,10" fill="#E08E00"/>
      <polygon points="95,0 99,10 110,10 101,17 104,27 95,20 86,27 89,17 80,10 91,10" fill="#E08E00"/>
    </g>
    <g transform="translate(25, 110)">
      <polygon points="15,0 19,10 30,10 21,17 24,27 15,20 6,27 9,17 0,10 11,10" fill="#0095DA"/>
      <polygon points="55,0 59,10 70,10 61,17 64,27 55,20 46,27 49,17 40,10 51,10" fill="#0095DA"/>
      <polygon points="95,0 99,10 110,10 101,17 104,27 95,20 86,27 89,17 80,10 91,10" fill="#0095DA"/>
    </g>
    <g transform="translate(25, 155)">
      <polygon points="15,0 19,10 30,10 21,17 24,27 15,20 6,27 9,17 0,10 11,10" fill="#E91E8C"/>
      <polygon points="55,0 59,10 70,10 61,17 64,27 55,20 46,27 49,17 40,10 51,10" fill="#E91E8C"/>
      <polygon points="95,0 99,10 110,10 101,17 104,27 95,20 86,27 89,17 80,10 91,10" fill="#E91E8C"/>
    </g>
  </g>

  <!-- Calming focus card at the bottom -->
  <g transform="translate(90, 335)" filter="url(#softShadow4)">
    <rect width="440" height="75" rx="18" fill="#FFFFFF"/>
    <circle cx="45" cy="37" r="22" fill="#EEF8E6"/>
    <path d="M35 37 L42 44 L55 31" stroke="#5E9E2A" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="80" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#0F2942">Gentle &amp; Nurturing Environment</text>
    <text x="80" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#4A5D73">Building confidence, emotional regulation &amp; school readiness</text>
  </g>
</svg>