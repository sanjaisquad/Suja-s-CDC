<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="hCare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F7"/>
      <stop offset="100%" stop-color="#FFF7E6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" rx="28" fill="url(#hCare)"/>

  <!-- Logo emblem inside hero card -->
  <g transform="translate(100, 50)" filter="url(#hShadow)">
    <!-- Heart outline -->
    <path d="M100 170 C100 170 30 116 30 70 C30 44 50 28 72 28 C84 28 95 35 100 42 C105 35 116 28 128 28 C150 28 170 44 170 70 C170 116 100 170 100 170 Z" fill="#E91E8C" opacity="0.15"/>
    <path d="M100 160 C100 160 40 110 40 70 C40 48 56 34 74 34 C84 34 94 40 100 48 C106 40 116 34 126 34 C144 34 160 48 160 70 C160 110 100 160 100 160 Z" fill="#E91E8C"/>
    
    <!-- Children silhouettes -->
    <circle cx="80" cy="80" r="14" fill="#0095DA"/>
    <circle cx="120" cy="80" r="14" fill="#E08E00"/>
    <path d="M68 98 C68 98 75 118 80 118 C85 118 92 98 92 98 Z" fill="#0095DA"/>
    <path d="M108 98 C108 98 115 118 120 118 C125 118 132 98 132 98 Z" fill="#E08E00"/>
    
    <!-- Caring Hands -->
    <path d="M50 100 C50 100 60 125 100 135 C140 125 150 100 150 100" stroke="#5E9E2A" stroke-width="6" stroke-linecap="round" fill="none"/>
    <polygon points="100,50 103,58 112,58 105,63 108,72 100,67 92,72 95,63 88,58 97,58" fill="#E08E00"/>
  </g>

  <!-- Lead Doctor Badge -->
  <g transform="translate(50, 260)" filter="url(#hShadow)">
    <rect width="300" height="85" rx="20" fill="#FFFFFF"/>
    <text x="150" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F2942" text-anchor="middle">Dr. J. Jansirani, B.O.T.</text>
    <text x="150" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#E91E8C" text-anchor="middle">Lead Pediatric Occupational Therapist</text>
    <text x="150" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#4A5D73" text-anchor="middle">Perumbakkam, Chennai</text>
  </g>

  <g transform="translate(60, 365)" filter="url(#hShadow)">
    <rect width="280" height="45" rx="22" fill="#EBF7FD"/>
    <text x="140" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0095DA" text-anchor="middle">Support • Guide • Build Skills • Grow</text>
  </g>

  <text x="200" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#E08E00" text-anchor="middle">Play ❤ Learn ❤ Grow Together</text>
</svg>