<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="otBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF7FD"/>
      <stop offset="100%" stop-color="#EEF8E6"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2942" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="450" rx="28" fill="url(#otBg)"/>
  
  <!-- Sensory Gym Backdrop & Play Mats -->
  <path d="M40 370 Q300 395 560 370 L560 410 Q300 435 40 410 Z" fill="#5E9E2A" opacity="0.2"/>
  <rect x="70" y="340" width="460" height="45" rx="22" fill="#FFFFFF" filter="url(#softShadow)"/>
  
  <!-- Therapy Swing / Hammock -->
  <path d="M150 40 L180 180" stroke="#0095DA" stroke-width="4" stroke-dasharray="8 4" stroke-linecap="round"/>
  <path d="M310 40 L280 180" stroke="#0095DA" stroke-width="4" stroke-dasharray="8 4" stroke-linecap="round"/>
  <path d="M170 180 Q230 250 290 180 Q230 220 170 180 Z" fill="#0095DA" filter="url(#softShadow)"/>
  
  <!-- Sensory Balance Discs & Stepping Stones -->
  <ellipse cx="140" cy="335" rx="55" ry="22" fill="#E91E8C" filter="url(#softShadow)"/>
  <ellipse cx="140" cy="330" rx="45" ry="16" fill="#FFF0F7"/>
  <circle cx="140" cy="330" r="10" fill="#E91E8C" opacity="0.6"/>

  <ellipse cx="250" cy="345" rx="60" ry="24" fill="#5E9E2A" filter="url(#softShadow)"/>
  <ellipse cx="250" cy="340" rx="48" ry="18" fill="#EEF8E6"/>
  <circle cx="250" cy="340" r="12" fill="#5E9E2A" opacity="0.6"/>

  <ellipse cx="365" cy="335" rx="55" ry="22" fill="#E08E00" filter="url(#softShadow)"/>
  <ellipse cx="365" cy="330" rx="45" ry="16" fill="#FFF7E6"/>
  <circle cx="365" cy="330" r="10" fill="#E08E00" opacity="0.6"/>

  <!-- Wooden Building Blocks & Fine Motor Pegboard -->
  <g transform="translate(420, 230)" filter="url(#softShadow)">
    <!-- Base block -->
    <rect x="0" y="70" width="85" height="35" rx="8" fill="#0095DA"/>
    <!-- Middle block -->
    <rect x="15" y="35" width="55" height="35" rx="8" fill="#E91E8C"/>
    <!-- Top pyramid -->
    <polygon points="42,0 15,35 70,35" fill="#E08E00"/>
    <circle cx="42" cy="18" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Tactile Sensory Beads / Pegs -->
  <circle cx="95" cy="270" r="14" fill="#E08E00" filter="url(#softShadow)"/>
  <circle cx="125" cy="250" r="18" fill="#0095DA" filter="url(#softShadow)"/>
  <circle cx="155" cy="275" r="12" fill="#5E9E2A" filter="url(#softShadow)"/>

  <!-- Playful Stars & Growth Leaves -->
  <path d="M470 90 Q485 70 500 90 Q485 110 470 90 Z" fill="#5E9E2A"/>
  <path d="M495 80 Q515 75 510 95 Q490 100 495 80 Z" fill="#5E9E2A" opacity="0.7"/>
  <polygon points="100,90 104,102 116,102 106,110 110,122 100,114 90,122 94,110 84,102 96,102" fill="#E08E00"/>
  <polygon points="410,120 413,128 422,128 415,134 418,142 410,136 402,142 405,134 398,128 407,128" fill="#E91E8C" opacity="0.8"/>

  <!-- Center Badge -->
  <g transform="translate(200, 75)" filter="url(#softShadow)">
    <rect width="200" height="42" rx="21" fill="#FFFFFF"/>
    <text x="100" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0095DA" text-anchor="middle">SENSORY GYM &amp; MOTOR</text>
  </g>
</svg>